<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Currency Converter</h1>
        <div>Enter Amount</div>
        <div><input type="text" placeholder="100" id="amount"></div>
        <div>
            <select id="from">
                <option value="usd">USD - United States Dollar</option>
            </select>
            <label>TO</label>
            <select id="to">
                <option value="int">INR - Indian Rupees</option>
            </select>
        </div>
        
        <button type="submit">convert</button>
        <div style="font-weight: bold;" id="convertedAmount"></div>
        <div id="errorMsg" style="font-weight: bold;color: red;">An error occurred, please try again later</div>
    </div>
    
    <script  src="index.js"></script>
</body>
</html>
